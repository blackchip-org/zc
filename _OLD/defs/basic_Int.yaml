name: basic/Int
title: Basic calculator, integer implementation
package: basic_Int

ops:
- name: add/i
  title: Addition
  funcs:
  - name: add
    params: [x:Int, y:Int]
    returns: [Int]
    prec: Int
  desc: Adds the value of *x* to *y*.
  example:
  - i: 6
    o: [6]
  - i: 2
    o: [6, 2]
  - i: add/i
    o: [8]

- name: mod/i
  title: Modulus
  funcs:
  - name: mod
    params: [x:Int, y:Int]
    returns: [Int]
    prec: Int
  desc: |-
    The modulus when *x* is divided by *y*. If *y* is zero, a 'division by
    zero' error is raised.
  example:
  - i: -7
    o: [-7]
  - i: 2
    o: [-7, 2]
  - i: mod/i
    o: [1]

- name: mul/i
  overloads: mul
  title: Multiplication
  funcs:
  - name: mul
    params: [x:Int, y:Int]
    returns: [Int]
    prec: Int
  desc: Multiplies the value of *x* by *y*.
  example:
  - i: 6
    o: [6]
  - i: 2
    o: [6, 2]
  - i: mul/i
    o: [12]

- name: neg/i
  overloads: neg
  title: Negation
  funcs:
  - name: neg
    params: [x:Int]
    returns: [Int]
    prec: Int
  desc: Changes the sign of *x*.
  example:
  - i: -6
    o: [-6]
  - i: neg/i
    o: [6]
  - i: neg/i
    o: [-6]

- name: pow/i
  title: Exponentiation
  funcs:
  - name: pow
    params: [x:Int, y:Int]
    returns: [Int]
    prec: Int
  desc: Raises *x* to the power of *y*.
  example:
  - i: 6
    o: [6]
  - i: 2
    o: [6, 2]
  - i: pow/i
    o: [36]

- name: rem/i
  aliases: [remi]
  title: Remainder
  funcs:
  - name: rem
    params: [x:Int, y:Int]
    returns: [Int]
    prec: Int
  desc: |-
    The remainder when *x* is divided by *y*. If *y* is zero, a
    'division by zero' error is raised.
  example:
  - i: -7
    o: [-7]
  - i: 2
    o: [-7, 2]
  - i: rem/i
    o: [-1]

- name: sign/i
  title: Sign
  funcs:
  - name: sign
    params: [x:Int]
    returns: [IntArch]
    prec: Int
  desc: |-
    Places `-1` on the stack if *x* is negative, `1` if *x* is positive, or `0`
    if *x* is zero.
  example:
  - i: c -6 sign
    o: [-1]
  - i: c 6 sign
    o: [1]
  - i: c 0 sign
    o: [0]

- name: sqrt/i
  title: Square root
  funcs:
  - name: sqrt
    params: [x:Int]
    returns: [Int]
  desc: |-
    The square root of *x*. If the result is not an integer, the value is
    floored. If *x* is less than zero, an 'invalid argument' error is raised.
  example:
  - i: 65536
    o: [65536]
  - i: sqrt/i
    o: [256]
  tests:
  - name: Zero
    test:
    - i: 0 sqrt/i
      o: [0]
  - name: Neg
    test:
    - i: -1 sqrt/i
      error: "sqrt/i: invalid argument, -1 < 0"

- name: sub/i
  title: Subtraction
  funcs:
  - name: sub
    params: [x:Int, y:Int]
    returns: [Int]
    prec: Int
  desc: Subtracts the value of *y* from *x*.
  example:
  - i: 6
    o: [6]
  - i: 2
    o: [6, 2]
  - i: sub/i
    o: [4]