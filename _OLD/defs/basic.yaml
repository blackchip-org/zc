name: basic
title: Basic Calculator

kinds:
  - Int

ops:
- name: add
  aliases: [a, "+"]
  ident: Add
  title: Addition
  funcs:
  - params: [x:Int, y:Int]
    returns: [Int]
  - params: [x:Float, y:Float]
    returns: [Float]
  desc: Adds the value of *x* to *y*.
  example:
  - i: 6
    o: [6]
  - i: 2
    o: [6, 2]
  - i: a
    o: [8]

- name: sub
  aliases: [s, "-"]
  ident: Sub
  title: Subtraction
  funcs:
  - params: [x:Int, y:Int]
    returns: [Int]
  - params: [x:Float, y:Float]
    returns: [Float]
  desc: Subtracts the value of *y* from *x*.
  example:
  - i: 6
    o: [6]
  - i: 2
    o: [6, 2]
  - i: s
    o: [4]
