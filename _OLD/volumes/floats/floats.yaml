name: floats
title: Sized floating-point numbers

kinds:
  - Float64

ops:
- name: add.float64
  aliases: [addf64]
  title: Addition
  funcs:
  - name: addFloat64
    params: [x:Float64, y:Float64]
    returns: [Float64]
  desc: Adds the value of *x* to *y*.
  example:
  - i: 1.1
    o: [1.1]
  - i: 2.2
    o: [1.1, 2.2]
  - i: a
    o: [3.3000000000000000002]