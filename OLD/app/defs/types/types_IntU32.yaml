name: types/Int/u32
title: Type operations

ops:
- name: max.u32
  title: Maximum unsigned 32-bit value
  macro: 4294967295
  desc: |-
    Maximum value of an unsigned 32-bit value: 2 32 pow 1 sub.
  example:
  - i: max.u32
    o: [4294967295]
  tests:
  - name: Example
    test:
    - i: c 2 32 pow 1 sub
      o: [4294967295]
