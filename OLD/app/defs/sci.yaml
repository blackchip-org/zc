name: sci
title: Scientific calculator
category: calc

ops:
- name: abs
  virtual: true
  title: Absolute value
  funcs:
  - params: [x:Int]
    returns: [Int]
  - name: AbsDecimal
    params: [x:Dec]
    returns: [Dec]
  - params: [x:Complex]
    returns: [Float/64]
  desc: |-
    If *x* is less than zero, the negated value of *x*, otherwise *p0*.

    For complex numbers, the distance of *x* from zero on the complex
    plane.
  example:
  - i: -6 abs
    o: [6]
  - i: c 2+2i abs 5 round
    o: [2.82843]
  tests:
  - name: Dec
    test:
    - i: -6.6 abs
      o: [6.6]

- name: acos
  virtual: true
  title: Inverse cosine
  funcs:
  - name: AcosFloat64
    params: [x:Float/64]
    returns: [Float/64]
  - params: [x:Complex]
    returns: [Complex]
  desc: Inverse cosine of *x* in radians.
  example:
  - i: 0.5 acos 5 round
    o: [1.0472]

- name: acosh
  virtual: true
  title: Inverse hyperbolic cosine
  funcs:
  - name: AcoshFloat64
    params: [x:Float/64]
    returns: [Float/64]
  - params: [x:Complex]
    returns: [Complex]
  desc: Inverse hyperbolic cosine of *x* in radians.
  example:
  - i: 2 acosh 5 round
    o: [1.31696]

- name: asin
  virtual: true
  title: Inverse sine
  funcs:
  - name: AsinFloat64
    params: [x:Float/64]
    returns: [Float/64]
  - params: [x:Complex]
    returns: [Complex]
  desc: Inverse sine of *x* in radians.
  example:
  - i: 0.5 asin 5 round
    o: [0.5236]

- name: asinh
  virtual: true
  title: Inverse hyperbolic sine
  funcs:
  - name: AsinhFloat64
    params: [x:Float/64]
    returns: [Float/64]
  - params: [x:Complex]
    returns: [Complex]
  desc: Inverse hyperbolic sine of *x* in radians.
  example:
  - i: 2 asinh 5 round
    o: [1.44364]

- name: atan
  virtual: true
  title: Inverse tangent
  funcs:
  - name: AtanFloat64
    params: [x:Float/64]
    returns: [Float/64]
  - params: [x:Complex]
    returns: [Complex]
  desc: Inverse tangent of *x* in radians.
  example:
  - i: 0.5 atan 5 round
    o: [0.46365]

- name: atan2
  title: Inverse tangent
  funcs:
  - name: Atan2Float64
    params: [x:Float/64, y:Float/64]
    returns: [Float/64]
  desc: Inverse tangent of *x/y* in radians.
  example:
  - i: 1 2 atan2 5 round
    o: [0.46365]

- name: atanh
  virtual: true
  title: Inverse hyperbolic tangent
  funcs:
  - name: AtanhFloat64
    params: [x:Float/64]
    returns: [Float/64]
  - params: [x:Complex]
    returns: [Complex]
  desc: Inverse hyperbolic tangent of *x* in radians.
  example:
  - i: 0.5 atanh 5 round
    o: [0.54931]

- name: cbrt
  title: Cube root
  funcs:
  - name: CbrtDecimal
    params: [x:Dec]
    returns: [Dec]
  desc: |-
    The cube root of *x*. If *x* is less than zero, an 'invalid argument'
    error is raised.
  example:
  - i: 27
    o: [27]
  - i: cbrt
    o: [3]

- name: ceil
  title: Ceiling
  funcs:
  - name: CeilDecimal
    params: [x:Dec]
    returns: [x:Dec]
  desc: |-
    The nearest integer value greater than or equal to *x*.
  example:
  - i: 6.6 ceil
    o: [7]

- name: cos
  virtual: true
  title: Cosine
  funcs:
  - name: CosFloat64
    params: [x:Float/64]
    returns: [Float/64]
  - params: [x:Complex]
    returns: [Complex]
  desc: Cosine of *x* in radians.
  example:
  - i: 2 cos 5 round
    o: [-0.41615]

- name: cosh
  virtual: true
  title: Hyperbolic cosine
  funcs:
  - name: CoshFloat64
    params: [x:Float/64]
    returns: [Float/64]
  - params: [x:Complex]
    returns: [Complex]
  desc: Hyperbolic cosine of *x* in radians.
  example:
  - i: 2 cosh 5 round
    o: [3.7622]

- name: cb
  title: Cube of a number
  macro: dup dup mul mul
  desc: |-
    The cube of a number, x³
  example:
  - i: 3 cb
    o: [27]

- name: exp
  virtual: true
  title: Natural exponential
  funcs:
  - name: ExpDecimal
    params: [x:Dec]
    returns: [Dec]
  - params: [x:Complex]
    returns: [Complex]
  desc: Natural exponential of *x*.
  example:
  - i: 2 exp 5 round
    o: [7.38906]

- name: floor
  title: Floor
  funcs:
  - name: FloorDecimal
    params: [x:Dec]
    returns: [x:Dec]
  desc: The nearest integer value less than or equal to *x*.
  example:
  - i: 6.12 floor
    o: [6]

- name: log
  virtual: true
  title: Natural logarithm
  funcs:
  - name: LogFloat64
    params: [x:Float/64]
    returns: [Float/64]
  - params: [x:Complex]
    returns: [Complex]
  desc: Natural logarithm of *x*.
  example:
  - i: 8 log 5 round
    o: [2.07944]

- name: log10
  virtual: true
  title: Decimal logarithm
  funcs:
  - name: Log10Decimal
    params: [x:Dec]
    returns: [Dec]
  - params: [x:Complex]
    returns: [Complex]
  desc: Natural logarithm of *x*.
  example:
  - i: 50 log10 5 round
    o: [1.69897]

- name: sin
  virtual: true
  title: Sine
  funcs:
  - name: SinFloat64
    params: [x:Float/64]
    returns: [Float/64]
  - params: [x:Complex]
    returns: [Complex]
  desc: Sine of *x* in radians.
  example:
  - i: 2 sin 5 round
    o: [0.9093]

- name: sinh
  virtual: true
  title: Hyperbolic sine
  funcs:
  - name: SinhFloat64
    params: [x:Float/64]
    returns: [Float/64]
  - params: [x:Complex]
    returns: [Complex]
  desc: Hyperbolic sine of *x* in radians.
  example:
  - i: 2 sinh 5 round
    o: [3.62686]

- name: tan
  virtual: true
  title: Tangent
  funcs:
  - name: TanFloat64
    params: [x:Float/64]
    returns: [Float/64]
  - params: [x:Complex]
    returns: [Complex]
  desc: Tangent of *x* in radians.
  example:
  - i: 2 tan 5 round
    o: [-2.18504]

- name: tanh
  virtual: true
  title: Hyperbolic tangent
  funcs:
  - name: TanhFloat64
    params: [x:Float/64]
    returns: [Float/64]
  - params: [x:Complex]
    returns: [Complex]
  desc: Hyperbolic tangent of *x* in radians.
  example:
  - i: 2 tanh 5 round
    o: [0.96403]

