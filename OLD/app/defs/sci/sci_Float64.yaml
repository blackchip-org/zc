name: sci/Float/64
title: Scientific calculator
subtitle: 64-bit float
category: calc

ops:
- name: cbrt/f
  title: Cube root
  funcs:
  - name: CbrtFloat64
    params: [x:Float/64]
    returns: [Float/64]
  desc: |-
    The cube root of *x*. If *x* is less than zero, an 'invalid argument'
    error is raised.
  example:
  - i: 10.648
    o: [10.648]
  - i: cbrt/f
    o: [2.2]

- name: exp/f
  title: Natural exponential
  funcs:
  - name: ExpFloat64
    params: [x:Float/64]
    returns: [Float/64]
  desc: Natural exponential of *x*.
  example:
  - i: 2 exp 5 round
    o: [7.38906]

- name: log10/f
  title: Decimal logarithm
  funcs:
  - name: Log10Float64
    params: [x:Float/64]
    returns: [Float/64]
  desc: Natural logarithm of *x*.
  example:
  - i: 50 log10 5 round
    o: [1.69897]
