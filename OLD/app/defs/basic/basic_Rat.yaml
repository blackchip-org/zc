name: basic/Rat
title: Basic calculator
subtitle: rational
category: calc

ops:
- name: add/r
  overloads: add
  title: Addition
  funcs:
  - name: AddRat
    params: [x:Rat, y:Rat]
    returns: [Rat]
  desc: Adds *x* to *y*.
  example:
  - i: 1/2 1/4 add/r
    o: [3/4]

- name: div/r
  overloads: div
  title: Division
  funcs:
  - name: DivRat
    params: [x:Rat, y:Rat]
    returns: [Rat]
  desc: |-
    Divides *x* by *y*. If *y* is equal to zero, a 'division by zero' error is
    raised.
  example:
  - i: 5 2 div/r
    o: [2 1/2]
  tests:
  - name: Zero
    test:
    - i: 5 0 div/r
      error: "div/r: division by zero"

- name: mul/r
  overloads: mul
  title: Multiplication
  funcs:
  - name: MulRat
    params: [x:Rat, y:Rat]
    returns: [Rat]
  desc: |-
    Multiplies *x* by *y*.
  example:
  - i: 1/16 4 mul/r
    o: [1/4]

- name: neg/r
  overloads: neg
  title: Negation
  funcs:
  - name: NegRat
    params: [x:Rat]
    returns: [Rat]
  desc: Changes the sign of *x*
  example:
  - i: 0.5 neg/r
    o: [-1/2]

- name: sub/r
  overloads: sub
  title: Subtraction
  funcs:
  - name: SubRat
    params: [x:Rat, y:Rat]
    returns: [Rat]
  desc: Subtracts *y* from *x*.
  example:
  - i: 3/4 1/2 sub/r
    o: [1/4]
