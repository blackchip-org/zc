name: int
title: Integer numbers
package: intb

kinds:
  - Int

ops:
- name: add.int
  overloads: add
  aliases: [addi]
  title: Addition
  funcs:
  - name: add
    params: [x:Int, y:Int]
    returns: [Int]
    prec: Int
  desc: Adds the value of *x* to *y*.
  example:
  - i: 6
    o: [6]
  - i: 2
    o: [6, 2]
  - i: a
    o: [8]

- name: pow.int
  overloads: pow
  aliases: [powi]
  title: Exponentiation
  funcs:
  - name: pow
    params: [x:Int, y:Int]
    returns: [Int]
    prec: Int
  desc: Raises *x* to the power of *y*.
  example:
  - i: 6
    o: [6]
  - i: 2
    o: [6, 2]
  - i: powi
    o: [36]

- name: sub.int
  overloads: sub
  aliases: [subi]
  title: Subtraction
  funcs:
  - name: sub
    params: [x:Int, y:Int]
    returns: [Int]
    prec: Int
  desc: Subtracts the value of *y* from *x*.
  example:
  - i: 6
    o: [6]
  - i: 2
    o: [6, 2]
  - i: s
    o: [4]