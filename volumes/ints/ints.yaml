name: ints
title: Sized integer numbers

kinds:
  - IntArch
  - Int8
  - Int16
  - Int32
  - Int64
  - IntArchU
  - Int8U
  - Int16U
  - Int32U
  - Int64U

ops:
- name: add.intarch
  aliases: [addia]
  ident: AddIntArch
  title: Addition, architecture sized integer
  funcs:
  - name: addIntArch
    params: [x:IntArch, y:IntArch]
    returns: [IntArch]
  desc: Adds the value of *x* to *y*.
  example:
  - i: 6
    o: [6]
  - i: 2
    o: [6, 2]
  - i: a
    o: [8]

- name: int8
  title: 8-bit signed integer
  funcs:
  - name: int8_
    params: [x:Int64]
    returns: [Int8]
  desc: Converts the value *x* to an 8-bit integer.
  example:
  - i: c 127 int8
    o: [127]
  - i: c 128 int8
    o: [-128]