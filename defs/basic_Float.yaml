name: basic/Float
title: Basic calculator, float implementation

ops:
- name: add/f
  overloads: add
  title: Addition
  funcs:
  - name: AddBigFloat
    params: [x:Float, y:Float]
    returns: [Float]
  desc: Adds the value of *x* to *y*.
  example:
  - i: 1.1
    o: [1.1]
  - i: 2.2
    o: [1.1, 2.2]
  - i: add/f
    o: [3.3000000000000000002]