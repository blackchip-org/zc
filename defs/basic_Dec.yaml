name: basic/Dec
title: Basic calculator, Decimals

ops:
- name: add/d
  overloads: add
  title: Addition
  funcs:
  - name: AddDec
    params: [x:Dec, y:Dec]
    returns: [Dec]
  desc: Adds the value of *x* to *y*.
  example:
  - i: 6.6
    o: [6.6]
  - i: 2.2
    o: [6.6, 2.2]
  - i: add/d
    o: [8.8]

- name: div/d
  overloads: div
  title: Division
  funcs:
  - name: DivDec
    params: [x:Dec, y:Dec]
    returns: [Dec]
  desc: |-
    Divides the value of *x* by *y*. If *y* is zero, a 'division by zero'
    error is raised.
  example:
  - i: 6.6
    o: [6.6]
  - i: 2
    o: [6.6, 2]
  - i: div/d
    o: [3.3]
  tests:
  - name: Thirds
    test:
      - i: 2 3 div/d
        o: [0.6666666666666667]
  - name: Zero
    test:
      - i: 6.6 0 div/d
        error: "div/d: division by zero"

- name: mul/d
  overloads: mul
  title: Multiplication
  funcs:
  - name: MulDec
    params: [x:Dec, y:Dec]
    returns: [Dec]
  desc: Multiplies the value of *x* by *y*.
  example:
  - i: 6.6
    o: [6.6]
  - i: 2.2
    o: [6.6, 2.2]
  - i: mul/d
    o: [14.52]

- name: neg/d
  overloads: neg
  title: Negation
  funcs:
  - name: NegDec
    params: [x:Dec]
    returns: [Dec]
  desc: Changes the sign of *x*.
  example:
  - i: -6.6
    o: [-6.6]
  - i: neg/d
    o: [6.6]
  - i: neg/d
    o: [-6.6]

- name: sub/d
  overloads: sub
  title: Subtraction
  funcs:
  - name: SubDec
    params: [x:Dec, y:Dec]
    returns: [Dec]
  desc: Subtracts the value of *y* from *x*
  example:
  - i: 6.6
    o: [6.6]
  - i: 2.2
    o: [6.6, 2.2]
  - i: sub/d
    o: [4.4]