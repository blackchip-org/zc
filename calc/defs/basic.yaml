name: basic
title: Basic calculator
category: calc

types:
  - Int
  - Int/32
  - Dec
  - Float
  - Text

ops:
- name: add
  aliases: [a, "+"]
  virtual: true
  title: Addition
  funcs:
  - params: [x:Int, y:Int]
    returns: [Int]
  - params: [x:Float, y:Float]
    returns: [Float]
  desc: Adds the value of * x* to *y*.
  example:
  - i: c 6 2 a
    o: [8]
  - i: c 1.1 2.2 a
    o: [3.3]

- name: mul
  title: Multiplication
  virtual: true
  funcs:
  - params: [x:Int, y:Int]
    returns: [Int]
  - params: [x:Dec, y:Dec]
    returns: [Dec]
  desc: Multiplies the value of *x* by *y*.
  example:
  - i: c 6 2 mul
    o: [12]
  - i: c 6.6 2.2 mul
    o: [14.52]


