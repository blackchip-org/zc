name: cmp
title: Comparisions
category: lib

ops:
- name: eq
  title: Equal
  funcs:
  - name: EqBigInt
    params: [x:Int, y:Int]
    returns: [Bool]
  - name: EqDecimal
    params: [x:Dec, y:Dec]
    returns: [Bool]
  - name: EqBigFloat
    params: [x:Float/v, y:Float/v]
    returns: [Bool]
  - name: EqRat
    params: [x:Rat, y:Rat]
    returns: [Bool]
  - name: EqComplex
    params: [x:Complex, y:Complex]
    returns: [Bool]
  - name: EqString
    params: [x:Text, y:Text]
    returns: [Bool]
  desc: Returns true if *x* and *y* are equal.
  example:
  - i: c 5 5 eq
    o: [true]
  - i: c 4 5 eq
    o: [false]
  tests:
  - name: Dec
    test:
    - i: c 5.5 5.5 eq
      o: [true]
    - i: c 4.4 5.5 eq
      o: [false]
  - name: Rat
    test:
    - i: c 1/2 1/2 eq
      o: [true]
    - i: c 1/3 1/2 eq
      o: [false]
  - name: Complex
    test:
    - i: c 5+5i 5+5i eq
      o: [true]
    - i: c 4+4i 5+5i eq
      o: [false]
  - name: String
    test:
    - i: c /e /e eq
      o: [true]
    - i: c /d /e eq
      o: [false]

- name: gt
  title: Greater than
  funcs:
  - name: GtBigInt
    params: [x:Int, y:Int]
    returns: [Bool]
  - name: GtDecimal
    params: [x:Dec, y:Dec]
    returns: [Bool]
  - name: GtBigFloat
    params: [x:Float/v, y:Float/v]
    returns: [Bool]
  - name: GtRat
    params: [x:Rat, y:Rat]
    returns: [Bool]
  - name: GtString
    params: [x:Text, y:Text]
    returns: [Bool]
  desc: Returns true if *x* is greater than *y*.
  example:
  - i: c 6 5 gt
    o: [true]
  - i: c 5 5 gt
    o: [false]
  - i: c 4 5 gt
    o: [false]
  tests:
  - name: Dec
    test:
    - i: c 6.5 5.5 gt
      o: [true]
    - i: c 5.5 5.5 gt
      o: [false]
    - i: c 4.4 5.5 gt
      o: [false]
  - name: Rat
    test:
    - i: c 2/3 1/2 gt
      o: [true]
    - i: c 1/2 1/2 gt
      o: [false]
    - i: c 1/3 1/2 gt
      o: [false]
  - name: String
    test:
    - i: c /f /e gt
      o: [true]
    - i: c /e /e gt
      o: [false]
    - i: c /d /e gt
      o: [false]

