- name: sort
  title: Sort stack
  funcs:
  - name: SortDecimal
    params: [Dec*]
    returns: [Dec*]
  - name: SortBigInt
    params: [Int*]
    returns: [Int*]
  - name: SortRat
    params: [Rat*]
    returns: [Rat*]
  - name: SortBigFloat
    params: [Float/v*]
    returns: [Float/v*]
  - name: SortString
    params: [Text*]
    returns: [Text*]
  desc: |-
    Sorts all items on the stack in ascending order. The entire stack must
    be of a similar type or able to be converted to a similar type. If no
    numeric common type can be found, items are sorted as text.
  example:
  - i: c 4 2.5 1.75 sort
    o: [1.75, 2.5, 4]
  - i: c 4 5/2 1.75 sort
    o: ["1 3/4", "2 1/2", 4]
  - i: "c 4 5/2 'one and three quarters' sort"
    o: [4, 5/2, 'one and three quarters']

- name: sort/t
  title: Sort stack as text
  subtitle: text sort
  funcs:
  - name: SortString
    params: [Text*]
    returns: [Text*]
  desc: Sorts the stack by their values as text.
  example:
  - i: 01.1 2 003 sort/t
    o: [003, 01.1, 2]