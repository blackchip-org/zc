    returns: [Bool]
  - name: GteString
    params: [x:Text, y:Text]
    returns: [Bool]
  desc: Returns true if *x* is greater than or equal to *y*. 
  example:
  - i: c 6 5 gte 
    o: [true]
  - i: c 5 5 gte
    o: [true]
  - i: c 4 5 gte 
    o: [false]
