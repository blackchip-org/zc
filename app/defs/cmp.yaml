  - name: LtDecimal
    params: [x:Dec, y:Dec]
    returns: [Bool]
  - name: LtBigFloat
    params: [x:Float/128, y:Float/128]
    returns: [Bool]
  - name: LtRat
    params: [x:Rat, y:Rat]
    returns: [Bool]
  - name: LtString
    params: [x:Text, y:Text]
    returns: [Bool]
  desc: Returns true if *x* is less than *y*. 
  example:
  - i: c 6 5 lt 
    o: [false]
  - i: c 5 5 lt
    o: [false]
  - i: c 4 5 lt 
    o: [true]
  tests:
  - name: Dec
    test:
    - i: c 6.5 5.5 lt
      o: [false]
    - i: c 5.5 5.5 lt
      o: [false]
    - i: c 4.4 5.5 lt
      o: [true]
  - name: Rat
    test:
    - i: c 2/3 1/2 lt
      o: [false]
    - i: c 1/2 1/2 lt
      o: [false]
    - i: c 1/3 1/2 lt
      o: [true]
  - name: String
    test:
    - i: c /f /e lt
      o: [false]
    - i: c /e /e lt 
      o: [false]
    - i: c /d /e lt
      o: [true]

