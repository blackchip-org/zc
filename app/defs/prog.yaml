name: prog
title: Programmer's calculator
category: calc

ops:
- name: and/i
  overloads: and
  title: Bitwise and
  funcs:
  - name: AndBigInt
    params: [x:Int, y:Int]
    returns: [x:Int]
  desc: The bitwise and of *x* and *y*.
  example:
  - i: 0b1100
    o: [0b1100]
  - i: 0b1010
    o: [0b1100, 0b1010]
  - i: and bin
    o: [0b1000]

- name: bin
  title: Binary conversion
  funcs:
  - name: Bin
    params: [x:Int]
    returns: [x:Text]
  desc: Converts the value of *x* to a base-2 representation.
  example:
  - i: 0x0f
    o: [0x0f]
  - i: bin
    o: [0b1111]
  test:
  - name: Negative
    test:
    - i: -1 bin
      o: [-0b1]

- name: bit
  title: Bit value
  funcs:
  - name: Bit
    params: [x:Int, n:Int/s]
    returns: [Int/u]
  desc: Value of the *n*th bit of *x*.
  example:
    - i: 0b100
      o: [0b100]
    - i: 2 bit
      o: [1]

- name: bits
  title: Bit length
  funcs:
  - name: Bits
    params: [x:Int]
    returns:  [x:Int/s]
  desc: Length of *x* in bits.
  example:
  - i: 0b11111
    o: [0b11111]
  - i: bits
    o: [5]

- name: bytes
  title: Byte length
  funcs:
  - name: Bytes
    params: [x:Int]
    returns:  [x:Int/s]
  desc: Length of *x* in bytes.
  example:
  - i: 0x1ff
    o: [0x1ff]
  - i: bytes
    o: [2]

- name: dec/i
  overloads: dec
  title: Decimal conversion
  funcs:
  - name: DecBigInt
    params: [x:Int]
    returns: [x:Int]
  desc: Converts the value of *x* to a base-10 representation.
  example:
  - i: 0xf
    o: [0xf]
  - i: dec
    o: [15]

- name: hex
  title: Hexadecimal conversion
  funcs:
  - name: Hex
    params: [x:Int]
    returns: [Text]
  desc: Converts the value of *x* to a base-16 representation.
  example:
  - i: 0b1111
    o: [0b1111]
  - i: hex
    o: [0xf]
  test:
  - name: Negative
    test:
    - i: -1 hex
      o: [-0x1]

- name: left.shift
  aliases: [lsh]
  title: Shift bits left
  funcs:
  - name: Lsh
    params: [x:Int, n:Int/u]
    returns: [Int]
  desc: Shifts all bits in *x* to the left by *n*.
  example:
  - i: 0b10
    o: [0b10]
  - i: 2 lsh bin
    o: [0b1000]

- name: not/i
  overloads: not
  title: Bitwise not
  funcs:
  - name: NotBigInt
    params: [x:Int]
    returns: [Int]
  desc: Bitwise not of *x*.
  example:
  - i: 0b101
    o: [0b101]
  - i: not bin
    o: [-0b110]

- name: oct
  title: Octal conversion
  funcs:
  - name: Oct
    params: [x:Int]
    returns: [Text]
  desc: Converts the value of *x* to a base-8 representation.
  example:
  - i: 0b1111
    o: [0b1111]
  - i: oct
    o: [0o17]
  test:
  - name: Negative
    test:
    - i: -1 oct
      o: [-0o1]

- name: or/i
  overloads: or
  title: Bitwise or
  funcs:
  - name: OrBigInt
    params: [x:Int, y:Int]
    returns: [x:Int]
  desc: The bitwise or of *x* and *y*.
  example:
  - i: 0b1100
    o: [0b1100]
  - i: 0b1010
    o: [0b1100, 0b1010]
  - i: or bin
    o: [0b1110]

- name: right.shift
  aliases: [rsh]
  title: Shift bits right
  funcs:
  - name: Rsh
    params: [x:Int, n:Int/u]
    returns: [Int]
  desc: Shifts all bits in *x* to the right by *n*.
  example:
  - i: 0b1000
    o: [0b1000]
  - i: 2 rsh bin
    o: [0b10]

- name: xor
  title: Bitwise exclusive or
  funcs:
  - name: XorBigInt
    params: [x:Int, y:Int]
    returns: [x:Int]
  desc: The bitwise exclusive of *x* and *y*.
  example:
  - i: 0b1100
    o: [0b1100]
  - i: 0b1010
    o: [0b1100, 0b1010]
  - i: xor bin
    o: [0b110]