name: dec
title: Fixed-point operations
category: lib

ops:
- name: dec
  title: Convert to decimal
  funcs:
  - name: Dec
    params: [x:Dec]
    returns: [Dec]
  - name: DecRat
    params: [x:Rat]
    returns: [Dec]
  desc: |-
    Converts a number into a decimal value.
  example:
  - i: c 0xff dec
    o: [255]
  - i: c 1/2 dec
    o: [0.5]

- name: rounding.mode/d
  title: Sets the default rounding mode
  funcs:
  - name: RoundingModeSet
    params: [m:Text]
  desc: |-
    Sets the rounding mode to one of the following:
    - ceil
    - down
    - floor
    - half.up
    - half.even
    - up

    If *m* is not one of the above, a invalid argument error is raised.
  example:
  - i: rounding.mode/d?
    o: ['half.even']
  - i: c 5.55 1 round
    o: [5.6]
  - i: /down rounding.mode/d
    notice: rounding mode set to down
  - i: c 5.55 1 round
    o: [5.5]

- name: rounding.mode/d?
  title: Gets the default rounding mode
  funcs:
  - name: RoundingModeGet
    returns: [Text]
  desc: |-
    Gets the current rounding mode which is one of the following:
    - ceil
    - down
    - floor
    - half.up
    - half.even
    - up
  example:
  - i: rounding.mode/d?
    o: ['half.even']

- name: trunc
  title: Truncate
  funcs:
  - name: Trunc
    params: [x:Dec]
    returns: [Dec]
  desc: |-
    Truncates the number *x* which is the same as rounding to an integer
    value towards zero.
  example:
  - i: c 3.9 trunc
    o: [3]
  - i: c -3.9 trunc
    o: [-3]


