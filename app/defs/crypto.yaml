name: crypto
title: Cryptographic functions
category: lib

ops:
- name: md5
  title: MD5 hash function
  funcs:
  - name: Md5
    params: [x:Data]
    returns: [Data]
  desc: Hash *x* with the MD5 function
  example:
  - i: "'Behind the tree!' md5"
    o: ["data: bbce0fb98a6a1b308e589d1408968ac2"]

- name: sha1
