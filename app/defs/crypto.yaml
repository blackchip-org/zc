- name: rotate.13
  aliases: [rot13]
  title: Rotate characters by 13
  funcs:
  - name: Rotate13
    params: [x:Text]
    returns: [Text]
  desc: |-
    Rotate all characters in *x* by 13 positions. This is a simple method to
    create spoiler text that is unreadable at first glance, but can easily
    be decrypted manually.
  example:
  - i: "'Behind the tree!' rot13"
    o: [Oruvaq gur gerr!]
  - i: rot13
    o: [Behind the tree!]
