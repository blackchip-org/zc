    o: ["data: da6e7f530a9b42a679944f0c9fc0f86ae5534450"]

- name: sha1.hmac
  title: SHA-1 keyed hash function
  funcs:
  - name: Sha1Hmac
    params: [x:Data, k:Data]
    returns: [Data]
  desc: Hash *x* with key *k* using the SHA-1 function
  example:
  - i: "'Behind the tree!' /swordfish"
    o: ["Behind the tree!", "swordfish"]
  - i: sha1.hmac
    o: ["data: 75859001097e8ad6907a879d340170ef571c8e5c"]

