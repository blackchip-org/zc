name: basic/Int/u32
title: Basic calculator
subtitle: unsigned 32-bit integer

ops:
- name: add/u32
  title: Addition
  funcs:
  - name: AddUint32
    params: [x:Int/u32, x:Int/u32]
    returns: [x:Int/u32]
  desc: Adds *x* to *y*. Value wraps around on overflow.
  example:
  - i: 4294967295 1 add/u32
    o: [0]

