name: basic/Complex
title: Basic calculator
subtitle: complex
category: calc

ops:
- name: add/c
  overloads: add
  title: Addition
  funcs:
  - name: AddComplex
    params: [x:Complex, y:Complex]
    returns: [Complex]
  desc: Adds *x* to *y*.
  example:
  - i: c 6+6i 2+2i add/c
    o: [8+8i]

- name: div/c
  overloads: div
  title: Division
  funcs:
  - name: DivComplex
    params: [x:Complex, y:Complex]
    returns: [Complex]
  desc: |-
    Divides *x* by *y*. If *y* is zero, a 'division by zero'
    error is raised.
  example:
  - i: c 12+12i 4+12i div/c
    o: [1.2-0.6i]

- name: mul/c
  overloads: mul
  title: Multiplication
  funcs:
  - name: MulComplex
    params: [x:Complex, y:Complex]
    returns: [Complex]
  desc: Multiplies *x* by *y*.
  example:
  - i: c 2+3i 4+4i mul/c
    o: [-4+20i]

- name: neg/c
  overloads: neg
  title: Negation
  funcs:
  - name: NegComplex
    params: [x:Complex]
    returns: [Complex]
  desc: Changes the sign of *x*.
  example:
  - i: -6
    o: [-6]
  - i: neg
    o: [6]
  - i: neg
    o: [-6]
  tests:
  - name: Complex
    test:
    - i: c -6+6i neg
      o: [6-6i]
    - i: c 6-6i neg
      o: [-6+6i]

- name: sqrt/c
  overloads: sqrt
  title: Square Root
  funcs:
  - name: SqrtComplex
    params: [x:Complex]
    returns: [Complex]
  desc: |-
    The square root of *x*. If *x* is less than zero, an 'invalid argument'
    error is raised.
  example:
  - i: -4 sqrt/c
    o: [0+2i]

- name: sub/c
  overloads: sub
  title: Subtraction
  funcs:
  - name: SubComplex
    params: [x:Complex, y:Complex]
    returns: [x:Complex]
  desc: Subtracts the value of *y* from *x*
  example:
  - i: c 6+6i 2+2i sub
    o: [4+4i]