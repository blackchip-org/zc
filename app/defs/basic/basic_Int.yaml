name: basic/Int
title: Basic calculator
subtitle: integer

ops:
- name: div/i
  title: Division
  funcs:
  - name: DivBigInt
    params: [x:Int, y:Int]
    returns: [Int]
  desc: |-
    Divides *x* by *y*. If *y* is zero, a 'division by zero'
    error is raised.
  example:
  - i: 6
    o: [6]
  - i: 2
    o: [6, 2]
  - i: div/i
    o: [3]
  tests:
  - name: Zero
    test:
    - i: 6 0 div/i
      error: "div/i: division by zero"

- name: sqrt/i
  title: Square root
  funcs:
  - name: SqrtBigInt
    params: [x:Int]
    returns: [Int]
  desc: |-
    The square root of *x*. If the result is not an integer, the value is
    floored. If *x* is less than zero, an 'invalid argument' error is raised.
  example:
  - i: 65536
    o: [65536]
  - i: sqrt/i
    o: [256]
  tests:
  - name: Zero
    test:
    - i: 0 sqrt/i
      o: [0]
  - name: Neg
    test:
    - i: -1 sqrt/i
      error: "sqrt/i: invalid argument, -1 < 0"


