name: basic/Float
title: Basic calculator
subtitle: float

ops:
- name: add/f
  overloads: add
  title: Addition
  funcs:
  - name: AddBigFloat
    params: [x:Float, y:Float]
    returns: [Float]
  desc: Adds the value of *x* to *y*.
  example:
  - i: 1.1
    o: [1.1]
  - i: 2.2
    o: [1.1, 2.2]
  - i: add/f
    o: [3.3000000000000000002]

- name: div/f
  overloads: div
  title: Division
  funcs:
  - name: DivBigFloat
    params: [x:Float, y:Float]
    returns: [Float]
  desc: |-
    Divides the valueof *x* by *y*. If *y* is zero, a 'division by zero'
    error is raised.
  example:
  - i: 2
    o: [2]
  - i: 3
    o: [2, 3]
  - i: div/f
    o: [0.6666666666666666667]
  tests:
  - name: Zero
    test:
    - i: 6 0 div/f
      error: "div/f: division by zero"

- name: mul/f
  overloads: mul
  title: Multiplication
  funcs:
  - name: MulBigFloat
    params: [x:Float, y:Float]
    returns: [Float]
  desc: Multiplies the value of *x* by *y*.
  example:
  - i: 6.6
    o: [6.6]
  - i: 2.2
    o: [6.6, 2.2]
  - i: mul/f
    o: [14.52]

- name: neg/f
  overloads: neg
  title: Negation
  funcs:
  - name: NegBigFloat
    params: [x:Float]
    returns: [Float]
  desc: Changes the sign of *x*.
  example:
  - i: -6.6
    o: [-6.6]
  - i: neg/f
    o: [6.6]
  - i: neg/f
    o: [-6.6]

- name: sign/f
  overloads: sign
  title: Sign
  funcs:
  - name: SignBigFloat
    params: [x:Float]
    returns: [Int/s]
  desc: |-
    Places `-1` on the stack if *x* is negative, `1` if *x* is positive, or `0`
    if *x* is zero.
  example:
  - i: c -6.4 sign/f
    o: [-1]
  - i: c 6.4 sign/f
    o: [1]
  - i: c 0 sign/f
    o: [0]

- name: sqrt/f
  overloads: sqrt
  title: Square Root
  funcs:
  - name: SqrtBigFloat
    params: [x:Float]
    returns: [Float]
  desc: |-
    The square root of *x*. If *x* is less than zero, an 'invalid argument'
    error is raised.
  example:
  - i: 1.25 sq
    o: [1.5625]
  - i: sqrt/f
    o: [1.25]
  tests:
  - name: Negative
    test:
    - i: -1 sqrt/f
      error: "sqrt/f: invalid argument, -1 < 0"

- name: sub/f
  overloads: sub
  title: Subtraction
  funcs:
  - name: SubBigFloat
    params: [x:Float, y:Float]
    returns: [Float]
  desc: Subtracts the value of *y* from *x*
  example:
  - i: 6.6
    o: [6.6]
  - i: 2.2
    o: [6.6, 2.2]
  - i: sub/f
    o: [4.3999999999999999997]