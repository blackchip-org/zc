name: basic/Int/u64
title: Basic calculator
subtitle: unsigned 64-bit integer

ops:
- name: add/u64
  title: Addition
  funcs:
  - name: AddUint64
    params: [x:Int/u64, x:Int/u64]
    returns: [Int/u64]
  desc: Adds *x* to *y*. Value wraps around on overflow.
  example:
  - i: 18446744073709551615 1 add/u64
    o: [0]
