name: conf
title: General configuration
category: calc

ops:
- name: float.prec=
  title: Sets the precision for floating-point numbers
  funcs:
  - name: FloatPrecSet
    params: [p:int/u]
  desc: |-
    Sets the precision for floating-point numbers to *p*. The precision is the
    maximum number of bits available for the mantissa.
  example:
  - i: float.prec?
    o: ['precision: 64']
  - i: c 2 3 div/f
    o: [0.6666666666666666667]
  - i: c 92 float.prec=
    info: precision set to 92
  - i: c 2 3 div/f
    o: [0.6666666666666666666666666667]

- name: float.prec?
  title: Gets the precision for floating-point numbers
  funcs:
  - name: FloatPrecGet
    returns: [p:int/u]
  desc: |-
    Places the current precision for floating-point numbers on the stack. The
    precision is the maximum number of bits available for the mantissa.
  example:
  - i: float.prec?
    o: ['precision: 64']

- name: rounding.mode=
  title: Sets the default rounding mode
  funcs:
  - name: RoundingModeSet
    params: [m:Text]
  desc: |-
    Sets the rounding mode to one of the following:
  example:
  - i: rounding.mode?
    o: ['half.even']
  - i: c 5.55 1 round
    o: [5.6]
  - i: /down rounding.mode=
    info: rounding mode set to down
  - i: c 5.55 1 round
    o: [5.5]

- name: rounding.mode?
  title: Gets the default rounding mode
  funcs:
  - name: RoundingModeGet
    returns: [Text]
  desc: |-
    TODO
  example:
  - i: rounding.mode?
    o: ['half.even']
