name: conf
title: General configuration
category: calc

ops:
- name: rounding.mode=
  title: Sets the default rounding mode
  funcs:
  - name: RoundingModeSet
    params: [m:Text]
  desc: |-
    Sets the rounding mode to one of the following:
    - ceil
    - down
    - floor
    - half.up
    - half.even
    - up

    If *m* is not one of the above, a invalid argument error is raised.
  example:
  - i: rounding.mode?
    o: ['half.even']
  - i: c 5.55 1 round
    o: [5.6]
  - i: /down rounding.mode=
    notice: rounding mode set to down
  - i: c 5.55 1 round
    o: [5.5]

- name: rounding.mode?
  title: Gets the default rounding mode
  funcs:
  - name: RoundingModeGet
    returns: [Text]
  desc: |-
    Gets the current rounding mode which is one of the following:
    - ceil
    - down
    - floor
    - half.up
    - half.even
    - up
  example:
  - i: rounding.mode?
    o: ['half.even']
