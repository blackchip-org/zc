  example:
  - i: c 1,000,000,000 int?/s32
    o: [true]
  - i: c 10,000,000,000 int?/s32
    o: [false]

- name: int?/s64
  title: Parses a signed 64-bit integer
  funcs:
  - name: Int64Is
    params: [x:Text]
    returns: [Bool]
  desc: |-
    Parses *x* and evaluates to `true` if the *x* is a valid signed 64-bit
    integer.
  example:
  - i: c 1,000,000,000,000,000,000 int?/s64
    o: [true]
  - i: c 10,000,000,000,000,000,000 int?/s64
    o: [false]

- name: int?/u
  title: Parses a unsigned architecture-sized integer
  funcs:
  - name: UintIs
    params: [x:Text]
    returns: [Bool]
  desc: |-
    Parses *x* and evaluates to `true` if the *x* is a valid unsigned
