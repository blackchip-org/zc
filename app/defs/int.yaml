- name: min.int
  title: Minimum integer values
  stub: true

- name: min.int/s
  title: Minimum signed architecture sized integer
  funcs:
  - name: MinInt
    returns: [Int/s]
  desc: |-
    For 32-bit architectures this is `min.int/s32`, and for 64-bit
    architectures this is `min.int/s64`.
  example:
  - i: min.int/s64 1 sub/s max.int/s64 eq
    o: [true]

