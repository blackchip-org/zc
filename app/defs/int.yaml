  example:
  - i: c 1,234 int?/u
    o: [true]
  - i: c 20,000,000,000,000,000,000 int?/u
    o: [false]

- name: int?/u8
  title: Parses a unsigned 8-bit integer
  funcs:
  - name: Uint8Is
    params: [x:Text]
    returns: [Bool]
  desc: |-
    Parses *x* and evaluates to `true` if the *x* is a valid unsigned 8-bit
    integer.
  example:
  - i: c 200 int?/u8
    o: [true]
  - i: c 300 int?/u8
    o: [false]

- name: int?/u16
  title: Parses a unsigned 16-bit integer
  funcs:
  - name: Uint16Is
    params: [x:Text]
    returns: [Bool]
  desc: |-
    Parses *x* and evaluates to `true` if the *x* is a valid unsigned 16-bit
    integer.
  example:
  - i: c 10,000 int?/u16
    o: [true]
  - i: c 100,000 int?/u16
    o: [false]

- name: int?/u32
  title: Parses a unsigned 32-bit integer
  funcs:
  - name: Uint32Is
    params: [x:Text]
    returns: [Bool]
  desc: |-
    Parses *x* and evaluates to `true` if the *x* is a valid unsigned 32-bit
