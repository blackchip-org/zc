name: int
title: Integer values
category: lib

ops:
- name: add/s
  title: Addition
  subtitle: signed architecture sized integer
  funcs:
  - name: AddInt
    params: [x:Int/s, y:Int/s]
    returns: [x:Int/s]
  desc: |-
    Adds *x* and *y* using signed architecture sized integers that wraparound
    on overflow or underflow.
  example:
  - i: max.int/s 1 add/s min.int/s eq
    o: [true]

- name: add/s8
  title: Addition
  subtitle: signed 8-bit integer
  funcs:
  - name: AddInt8
    params: [x:Int/s8, y:Int/s8]
    returns: [x:Int/s8]
  desc: |-
    Adds *x* and *y* using signed 8-bit integers that wraparound on overflow
    or underflow.
  example:
  - i: 127 1 add/s8
    o: [-128]

- name: add/s16
  title: Addition
  subtitle: signed 16-bit integer
  funcs:
  - name: AddInt16
    params: [x:Int/s16, y:Int/s16]
    returns: [x:Int/s16]
  desc: |-
    Adds *x* and *y* using signed 16-bit integers that wraparound on overflow
    or underflow.
  example:
  - i: 32767 1 add/s16
    o: [-32768]

- name: add/s32
  title: Addition
  subtitle: signed 32-bit integer
  funcs:
  - name: AddInt32
    params: [x:Int/s32, y:Int/s32]
    returns: [x:Int/s32]
  desc: |-
    Adds *x* and *y* using signed 32-bit integers that wraparound on overflow
    or underflow.
  example:
  - i: 2147483647 1 add/s32
    o: [-2147483648]

- name: add/s64
  title: Addition
  subtitle: signed 64-bit integer
  funcs:
  - name: AddInt64
    params: [x:Int/s64, y:Int/s64]
    returns: [x:Int/s64]
  desc: |-
    Adds *x* and *y* using signed 64-bit integers that wraparound on overflow
    or underflow.
  example:
  - i: 9223372036854775807 1 add/s64
    o: [-9223372036854775808]

- name: add/u
  title: Addition
  subtitle: unsigned architecture sized integer
  funcs:
  - name: AddUint
    params: [x:Int/u, y:Int/u]
    returns: [x:Int/u]
  desc: |-
    Adds *x* and *y* using unsigned architecture sized integers that wraparound
    on overflow or underflow.
  example:
  - i: max.int/u 1 add/u 0 eq
    o: [true]

- name: add/u8
  title: Addition
  subtitle: unsigned 8-bit integer
  funcs:
  - name: AddUint8
    params: [x:Int/u8, y:Int/u8]
    returns: [x:Int/u8]
  desc: |-
    Adds *x* and *y* using unsigned 8-bit integers that wraparound on overflow
    or underflow.
  example:
  - i: 255 1 add/u8
    o: [0]

- name: add/u16
  title: Addition
  subtitle: unsigned 16-bit integer
  funcs:
  - name: AddUint16
    params: [x:Int/u16, y:Int/u16]
    returns: [x:Int/u16]
  desc: |-
    Adds *x* and *y* using unsigned 16-bit integers that wraparound on overflow
    or underflow.
  example:
  - i: 65535 1 add/u16
    o: [0]

- name: add/u32
  title: Addition
  subtitle: unsigned 32-bit integer
  funcs:
  - name: AddUint32
    params: [x:Int/u32, y:Int/u32]
    returns: [x:Int/u32]
  desc: |-
    Adds *x* and *y* using unsigned 32-bit integers that wraparound on overflow
    or underflow.
  example:
  - i: 4294967295 1 add/u32
    o: [0]

- name: add/u64
  title: Addition
  subtitle: unsigned 64-bit integer
  funcs:
  - name: AddUint64
    params: [x:Int/u64, y:Int/u64]
    returns: [x:Int/u64]
  desc: |-
    Adds *x* and *y* using unsigned 64-bit integers that wraparound on overflow
    or underflow.
  example:
  - i: 18446744073709551615 1 add/u64
    o: [0]

- name: data-int
  title: Converts big-endian bytes to an integer
  funcs:
  - name: DataToInt
    params: [x:Data]
    returns: [Int]
  desc: |-
    Converts big-endian bytes into an integer.
  example:
  - i: 0x1234 int-data
    o: ["data: 1234"]
  - i: data-int hex
    o: [0x1234]

- name: int?
  title: Parses an integer
  funcs:
  - name: BigIntIs
    params: [x:Text]
    returns: [Bool]
  desc: Parses *x* and evaluates to `true` if the *x* is an integer.
  example:
  - i: c 1,234 int?
    o: [true]
  - i: c 1.234 int?
    o: [false]

- name: int?/s
  title: Parses a signed architecture-sized integer
  funcs:
  - name: IntIs
    params: [x:Text]
    returns: [Bool]
  desc: |-
    Parses *x* and evaluates to `true` if the *x* is a valid signed
    architecture-sized integer.
  example:
  - i: c 1,234 int?/s
    o: [true]
  - i: c 20000000000000000000 int?/s
    o: [false]

- name: int?/s8
  title: Parses a signed 8-bit integer
  funcs:
  - name: Int8Is
    params: [x:Text]
    returns: [Bool]
  desc: |-
    Parses *x* and evaluates to `true` if the *x* is a valid signed 8-bit
    integer.
  example:
  - i: c 100 int?/s8
    o: [true]
  - i: c 200 int?/s8
    o: [false]

- name: int?/s16
  title: Parses a signed 16-bit integer
  funcs:
  - name: Int16Is
    params: [x:Text]
    returns: [Bool]
  desc: |-
    Parses *x* and evaluates to `true` if the *x* is a valid signed 16-bit
    integer.
  example:
  - i: c 10,000 int?/s16
    o: [true]
  - i: c 100,000 int?/s16
    o: [false]

- name: int?/s32
  title: Parses a signed 32-bit integer
  funcs:
  - name: Int32Is
    params: [x:Text]
    returns: [Bool]
  desc: |-
    Parses *x* and evaluates to `true` if the *x* is a valid signed 32-bit
