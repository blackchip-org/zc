    o: [true]
  - i: c 100,000,000,000,000,000,000 int?/u64
    o: [false]

- name: int-data
  title: Converts integer to big-endian bytes
  funcs:
  - name: IntToData
    params: [x:Int]
    returns: [Data]
  desc: |-
    Converts the integer *x* to its binary representation in big-endian
    order.
  example:
  - i: 0x1234 int-data
    o: ["data: 1234"]

- name: max.int
  title: Maximum integer values
  stub: true

- name: max.int/s
  title: Maximum signed architecture sized integer
  funcs:
  - name: MaxInt
    returns: [Int/s]
  desc: |-
    For 32-bit architectures this is `max.int/s32`, and for 64-bit
    architectures this is `max.int/s64`.
  example:
  - i: max.int/s 1 add/s min.int/s eq
    o: [true]

- name: max.int/s8
  title: Maximum signed 8-bit integer
  macro: 127
  desc: Maximum signed 8-bit integer.
  example:
  - i: max.int/s8
    o: [127]
  - i: 1 7 lsh 1 sub eq
    o: [true]

- name: max.int/s16
  title: Maximum signed 16-bit integer
  macro: 32767
  desc: Maximum signed 16-bit integer.
  example:
  - i: max.int/s16
    o: [32767]
  - i: 1 15 lsh 1 sub eq
    o: [true]

- name: max.int/s32
  title: Maximum signed 32-bit integer
  macro: 2147483647
  desc: Maximum signed 32-bit integer.
  example:
  - i: max.int/s32
    o: [2147483647]
  - i: 1 31 lsh 1 sub eq
    o: [true]

- name: max.int/s64
  title: Maximum signed 64-bit integer
