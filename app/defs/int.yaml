- name: sub/s
  title: Subtraction
  subtitle: signed architecture sized integer
  funcs:
  - name: SubInt
    params: [x:Int/s, y:Int/s]
    returns: [x:Int/s]
  desc: |-
    Subtracts *y* and *x* using signed architecture sized integers that
    wraparound on overflow or underflow.
  example:
  - i: min.int/s 1 sub/s max.int/s eq
    o: [true]

