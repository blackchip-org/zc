name: types/Int/u16
title: Type operations
subtitle: unsigned 16-bit integer

ops:
- name: max.val/u16
  title: Maximum unsigned 16-bit value
  macro: 65535
  desc: |-
    Maximum value of an unsigned 16-bit value: 2 16 pow 1 sub.
  example:
  - i: max.val/u16
    o: [65535]
  tests:
  - name: Example
    test:
    - i: c 2 16 pow 1 sub
      o: [65535]
