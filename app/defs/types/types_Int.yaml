name: types/Int
title: Type operations
subtitle: integer

ops:
- name: max.val/u8
  title: Maximum unsigned 8-bit value
  macro: 255
  desc: |-
    Maximum value of an unsigned 8-bit value: 2 8 pow 1 sub.
  example:
  - i: max.val/u8
    o: [255]
  tests:
  - name: Example
    test:
    - i: c 2 8 pow 1 sub
      o: [255]

- name: max.val/u16
  title: Maximum unsigned 16-bit value
  macro: 65535
  desc: |-
    Maximum value of an unsigned 16-bit value: 2 16 pow 1 sub.
  example:
  - i: max.val/u16
    o: [65535]
  tests:
  - name: Example
    test:
    - i: c 2 16 pow 1 sub
      o: [65535]