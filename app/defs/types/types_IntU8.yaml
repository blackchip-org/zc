name: types/Int/u8
title: Type operations

ops:
- name: max.val/u8
  overloads: max.val
  title: Maximum unsigned 8-bit integer
  macro: 255
  desc: |-
    Maximum value of an unsigned 8-bit value: 2 8 pow 1 sub.
  example:
  - i: max.val/u8
    o: [255]
  tests:
  - name: Example
    test:
    - i: c 2 8 pow 1 sub
      o: [255]