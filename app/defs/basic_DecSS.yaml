name: basic/Dec/SS
title: Basic calculator
subtitle: decimal (shopspring)

ops:
- name: add/d/ss
  title: Addition
  funcs:
  - name: AddDecimalSS
    params: [x:Dec/ss, y:Dec/ss]
    returns: [Dec/ss]
  desc: Adds the value of *x* to *y*.
  example:
  - i: 6.6
    o: [6.6]
  - i: 2.2
    o: [6.6, 2.2]
  - i: add/d/ss
    o: [8.8]

- name: div/d/ss
  title: Division
  funcs:
  - name: DivDecimalSS
    params: [x:Dec/ss, y:Dec/ss]
    returns: [Dec/ss]
  desc: |-
    Divides the value of *x* by *y*. If *y* is zero, a 'division by zero'
    error is raised.
  example:
  - i: 6.6
    o: [6.6]
  - i: 2
    o: [6.6, 2]
  - i: div/d/ss
    o: [3.3]
  tests:
  - name: Thirds
    test:
      - i: 2 3 div/d/ss
        o: [0.6666666666666667]
  - name: Zero
    test:
      - i: 6.6 0 div/d/ss
        error: "div/d/ss: division by zero"

- name: mod/d/ss
  title: Modulus
  funcs:
  - name: ModDecimalSS
    params: [x:Dec/ss, y:Dec/ss]
    returns: [Dec/ss]
  desc: |-
    The modulus when *x* is divided by *y*. If *y* is zero, a 'division by
    zero' error is raised.
  example:
  - i: 6.75
    o: [6.75]
  - i: 0.5
    o: [6.75, 0.5]
  - i: mod/d/ss
    o: [0.25]

- name: mul/d/ss
  title: Multiplication
  funcs:
  - name: MulDecimalSS
    params: [x:Dec/ss, y:Dec/ss]
    returns: [Dec/ss]
  desc: Multiplies the value of *x* by *y*.
  example:
  - i: 6.6
    o: [6.6]
  - i: 2.2
    o: [6.6, 2.2]
  - i: mul/d/ss
    o: [14.52]

- name: neg/d/ss
  title: Negation
  funcs:
  - name: NegDecimalSS
    params: [x:Dec/ss]
    returns: [Dec/ss]
  desc: Changes the sign of *x*.
  example:
  - i: -6.6
    o: [-6.6]
  - i: neg/d/ss
    o: [6.6]
  - i: neg/d/ss
    o: [-6.6]

- name: pow/d/ss
  title: Exponentiation
  funcs:
  - name: PowDecimalSS
    params: [x:Dec/ss, y:Dec/ss]
    returns: [Dec/ss]
  desc: Raises *x* to the power of *y*.
  example:
  - i: 6.6
    o: [6.6]
  - i: 2.2
    o: [6.6, 2.2]
  - i: pow/d/ss
    o: [63.53260431279859336003829262]

- name: rem/d/ss
  title: Remainder
  funcs:
  - name: RemDecimalSS
    params: [x:Dec/ss, y:Dec/ss, p:Int/s32]
    returns: [Dec/ss]
  desc: |-
    Remainder after dividing *y* by *x* with precision *p*. If *y* is zero, a
    'division by zero' error is raised.

    The example below shows there is a one cent remainder when $100 is
    divided among three people.
  example:
  - i: $100
    o: [$100]
  - i: 3
    o: [$100, 3]
  - i: 2 rem/d/ss
    o: [0.01]

- name: sub/d/ss
  title: Subtraction
  funcs:
  - name: SubDecimalSS
    params: [x:Dec/ss, y:Dec/ss]
    returns: [Dec/ss]
  desc: Subtracts the value of *y* from *x*
  example:
  - i: 6.6
    o: [6.6]
  - i: 2.2
    o: [6.6, 2.2]
  - i: sub/d/ss
    o: [4.4]