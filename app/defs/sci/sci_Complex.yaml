name: sci/Complex
title: Scientific calculator
subtitle: 128-bit complex
category: calc

ops:
- name: abs/c
  overloads: abs
  title: Distance from zero in complex plane
  funcs:
  - name: AbsComplex
    params: [x:Complex]
    returns: [Float/64]
  desc: |-
    the distance of *x* from zero in the complex plane.
  example:
  - i: 2+2i abs/c 5 round
    o: [2.82843]

- name: acos/c
  overloads: acos
  title: Inverse cosine
  funcs:
  - name: AcosComplex
    params: [x:Complex]
    returns: [Complex]
  desc: Inverse cosine of *x*.
  example:
  - i: 0.5+1i acos/c 5 round
    o: [1.22136-0.92613i]

- name: acosh/c
  overloads: acosh
  title: Inverse hyperbolic cosine
  funcs:
  - name: AcoshComplex
    params: [x:Complex]
    returns: [Complex]
  desc: Inverse hyperbolic cosine of *x*.
  example:
  - i: 2+2i acosh/c 5 round
    o: [1.73432+0.81655i]

- name: asin/c
  overloads: asin
  title: Inverse sine
  funcs:
  - name: AsinComplex
    params: [x:Complex]
    returns: [Complex]
  desc: Inverse sine of *x*.
  example:
  - i: 0.5+2i asin/c 5 round
    o: [0.22102+1.46572i]

- name: asinh/c
  overloads: asinh
  title: Inverse hyperbolic sine
  funcs:
  - name: AsinhComplex
    params: [x:Complex]
    returns: [Complex]
  desc: Inverse hyperbolic sine of *x*.
  example:
  - i: 2+2i asinh/c 5 round
    o: [1.73432+0.75425i]

- name: atan/c
  overloads: atan
  title: Inverse tangent
  funcs:
  - name: AtanComplex
    params: [x:Complex]
    returns: [Complex]
  desc: Inverse tangent of *x*.
  example:
  - i: 0.5+2i atan/c 5 round
    o: [1.42155+0.50037i]

- name: atanh/c
  overloads: atanh
  title: Inverse hyperbolic tangent
  funcs:
  - name: AtanhComplex
    params: [x:Complex]
    returns: [Complex]
  desc: Inverse hyperbolic tangent of *x*.
  example:
  - i: 0.5+2i atanh/c 5 round
    o: [0.09642+1.12656i]

- name: cos/c
  overloads: cos
  title: Cosine
  funcs:
  - name: CosComplex
    params: [x:Complex]
    returns: [Complex]
  desc: Cosine of *x*.
  example:
  - i: 2+2i cos/c 5 round
    o: [-1.56563-3.29789i]

- name: cosh/c
  overloads: cosh
  title: Hyperbolic cosine
  funcs:
  - name: CoshComplex
    params: [x:Complex]
    returns: [Complex]
  desc: Hyperbolic cosine of *x*.
  example:
  - i: 2+2i cosh/c 5 round
    o: [-1.56563+3.29789i]

- name: cot/c
