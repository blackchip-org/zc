name: sci/Float/64
title: Scientific calculator
subtitle: 64-bit floating-point
category: calc

ops:
- name: abs/f64
  overloads: abs
  title: Absolute value
  funcs:
  - name: AbsFloat64
    params: [x:Float/64]
    returns: [Float/64]
  desc: |-
    If *x* is less than zero, the negated value of *x*, otherwise *p0*.
  example:
  - i: -6.6
    o: [-6.6]
  - i: abs
    o: [6.6]

- name: acos/f64
  overloads: acos
  title: Inverse cosine
  funcs:
  - name: AcosFloat64
    params: [x:Float/64]
    returns: [Float/64]
  desc: Inverse cosine of *x* in radians.
  example:
  - i: 0.5 acos 5 round
    o: [1.0472]

- name: acosh/f64
  overloads: acosh
  title: Inverse hyperbolic cosine
  funcs:
  - name: AcoshFloat64
    params: [x:Float/64]
    returns: [Float/64]
  desc: Inverse hyperbolic cosine of *x* in radians.
  example:
  - i: 2 acosh 5 round
    o: [1.31696]

