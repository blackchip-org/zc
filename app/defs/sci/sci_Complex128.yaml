name: sci/Complex/128
title: Scientific calculator
subtitle: 128-bit complex
category: calc

ops:
- name: abs/c128
  overloads: abs
  title: Distance from zero in complex plane
  funcs:
  - name: AbsComplex128
    params: [x:Complex/128]
    returns: [Float/64]
  desc: |-
    the distance of *x* from zero in the complex plane.
  example:
  - i: 2+2i abs 5 round
    o: [2.82843]
