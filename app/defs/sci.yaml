name: sci
title: Scientific calculator
category: calc

ops:
- name: acos
  title: Inverse cosine
  funcs:
  - name: AcosFloat64
    params: [x:Float/64]
    returns: [Float/64]
  - name: AcosComplex
    params: [x:Complex]
    returns: [Complex]
  desc: Inverse cosine of *x* in radians.
  example:
  - i: 0.5 acos 5 round
    o: [1.0472]

- name: acosh
  title: Inverse hyperbolic cosine
  funcs:
  - name: AcoshFloat64
    params: [x:Float/64]
    returns: [Float/64]
  - name: AcoshComplex
    params: [x:Complex]
    returns: [Complex]
  desc: Inverse hyperbolic cosine of *x* in radians.
  example:
  - i: 2 acosh 5 round
    o: [1.31696]

- name: asin
  title: Inverse sine
  funcs:
  - name: AsinFloat64
    params: [x:Float/64]
    returns: [Float/64]
  - name: AsinComplex
    params: [x:Complex]
    returns: [Complex]
  desc: Inverse sine of *x* in radians.
  example:
  - i: 0.5 asin 5 round
    o: [0.5236]

- name: asinh
