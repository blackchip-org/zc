- name: e 
  title: Euler's number
  macro: 2.71828182845904523536028747135266249775724709369995957496696763
  desc: Euler's number, the natural logarithm base.
  example:
  - i: e
    o: [2.71828182845904523536028747135266249775724709369995957496696763]

- name: pi 
  title: Circumference to diameter ratio
  macro: 3.14159265358979323846264338327950288419716939937510582097494459
  desc: The ratio between a cirlce's circumference to its diameter. 
  example:
  - i: pi 
    o: [3.14159265358979323846264338327950288419716939937510582097494459]

