name: prog/Int/u8
title: Programmer's calculator
subtitle: unsigned 8-bit integers

ops:
- name: add/u8
  title: Addition
  funcs:
  - name: AddUint8
    params: [x:Int/u8, y:Int/u8]
    returns: [Int/u8]
  desc: |-
    Adds *x* to *y*. The carry flag is set if the result is larger than an
    8-bit integer. The overflow flag is set if the result is larger than
    an signed 8-bit integer.
  sources:
  - https://stackoverflow.com/questions/8034566/overflow-and-carry-flags-on-z80/8037485%238037485
  example:
  - i: 255 1 add/u8
    o: [0]
  - i: info
    info: "Int/u8: carry"
  - i: c 127 1 add/u8
    o: [128]
  - i: info
    info: "Int/u8: overflow"

- name: int/u8
  title: Signed 8-bit conversion
  funcs:
  - name: Uint8Uint64
    params: [x:Int/u64]
    returns: [x:Int/u8]
  - name: Uint8Int64
    params: [x:Int/s64]
    returns: [x:Int/u8]
  desc: Converts *x* into a signed 8-bit integer.
  example:
  - i: 0x1234 int/u8 hex
    o: [0x34]
  tests:
  - name: Negative
    test:
    - i: -1 int/u8 hex
      o: [0xff]

- name: left.rotate/u8
  aliases: [lro/u8]
  title: Rotate bits left
  funcs:
  - name: LeftRotateUint8
    params: [x:Int/u8]
    returns: [x:Int/u8]
  desc: |-
    Shifts all bits in *x* to the left by one. The lowest bit is set to the
    value of the highest bit that is shifted out.
  example:
  - i: 0b11000000 lro/u8
    o: [129]
  - i: bin
    o: [0b10000001]

- name: left.shift/u8
  aliases: [lsh/u8]
  title: Shift bits left
  funcs:
  - name: LeftShiftUint8
    params: [x:Int/u8]
    returns: [x:Int/u8]
  desc: |-
    Shifts all bits in *x* to the left by one. The carry flag is set to the
    value of the bit shifted out.
  example:
  - i: 0b11000000 lsh/u8
    o: [128]
  - i: "?"
    info: "Int/u8: carry"
  - i: bin
    o: [0b10000000]
  - i: "?"
    info: "Int: carry"

- name: neg/u8
  title: Negation
  funcs:
  - name: NegUint8
    params: [x:Int/u8]
    returns: [Int/u8]
  desc: |-
    Negates the value of *x*.
  example:
  - i: 0x01 neg/u8 hex
    o: [0xff]

- name: not/u8
  title: Bitwise not
  funcs:
  - name: NotUint8
    params: [x:Int/u8]
    returns: [x:Int/u8]
  desc: |-
    Bitwise not of *x*.
  example:
  - i: 0x01 not/u8 hex
    o: [0xfe]

- name: right.rotate/u8
  aliases: [rro/u8]
  title: Rotate bits right
  funcs:
  - name: RightRotateUint8
    params: [x:Int/u8]
    returns: [x:Int/u8]
  desc: |-
    Shifts all bits in *x* to the right by one. The highest bit is set to the
    value of the lowest bit that is shifted out.
  example:
  - i: 0b11000000 lro/u8
    o: [129]
  - i: bin
    o: [0b10000001]

- name: right.shift/u8
  aliases: [rsh/u8]
  title: Shift bits right
  funcs:
  - name: RightShiftUint8
    params: [x:Int/u8]
    returns: [x:Int/u8]
  desc: |-
    Shifts all bits in *x* to the left by one. The carry flag is set to the
    value of the bit shifted out.
  example:
  - i: 0b11 rsh/u8
    o: [1]
  - i: "?"
    info: "Int/u8: carry"
  - i: bin
    o: [0b1]
  - i: "?"
    info: "Int: carry"

- name: sub/u8
  title: Subtraction
  funcs:
  - name: SubUint8
    params: [x:Int/u8, y:Int/u8]
    returns: [Int/u8]
  desc: |-
    Subtracts *y* from *x*. The carry flag is clear if the result is larger than
    an 8-bit integer. The overflow flag is set if the result is larger than
    an signed 8-bit integer.
  sources:
  - https://stackoverflow.com/questions/8034566/overflow-and-carry-flags-on-z80/8037485%238037485
  example:
  - i: 0 1 sub/u8
    o: [255]
  - i: info
    info: "Int/u8: carry"
  - i: c 128 1 sub/u8
    o: [127]
  - i: info
    info: "Int/u8: overflow"

