name: geo
title: Geo-spatial calculations
category: lib

ops:
- name: earth.radius
  title: Mean radius of the Earth
  macro: 6,371,000 /m unit
  desc: |-
    The volumetric mean radius of the Earth in meters.

    Source:
    https://nssdc.gsfc.nasa.gov/planetary/factsheet/earthfact.html

- name: earth.radius.equatorial
  title: Equatorial radius of the Earth
  macro: 6,378,137 /m unit
  desc: |-
    The equatorial radius of the Earth in meters.

    Source:
    https://nssdc.gsfc.nasa.gov/planetary/factsheet/earthfact.html

- name: earth.radius.polar
  title: Polar radius of the Earth
  macro: 6,356,752 /m unit
  desc: |-
    The polar radius of the Earth in meters.

    Source:
    https://nssdc.gsfc.nasa.gov/planetary/factsheet/earthfact.html

- name: haversine
  title: Great circle distance between two points
  funcs:
  - name: Haversine
    params: [lat1:Angle/DMS, lon1:Angle/DMS, lat2:Angle/DMS, lon2:Angle/DMS]
    returns: [Float/64]
  desc: |-
    Calculates the great circle distance between (*lat0*, *lon0*) and
    (*lat1*, *lon1*) using the haversine formula.

    Source:
    https://community.esri.com/t5/coordinate-reference-systems-blog/distance-on-a-sphere-the-haversine-formula/ba-p/902128

    The following shows the great circle distance between Washington, DC
    and New York, NY:
  example:
  - i: 38°54′17″N 77°00′59″W
    o: [38°54′17″N, 77°00′59″W]
  - i: 40°42′46″N 74°00′22″W
    o: [38°54′17″N, 77°00′59″W, 40°42′46″N, 74°00′22″W]
  - i: haversine 2 round
    o: [326364.76 m]
  - i: m-km 2 round
    o: [326.36 km]
  - i: km-mi 2 round
    o: [202.79 mi]

- name: proj
  title: Transform coordinate
  funcs:
  - name: Proj
    params: [p0:Float/64, p1:Float/64, s:Text, t:Text]
    returns: [Float/64, Float/64]
  desc: |-
    Transform coordinate (*p0*, *p1*) in coordinate system *s* to a coordinate
    in system *t*. The order of the coordinates is defined by the coordinate
    system and it may be (lat, lon) or (x, y).

    This operation is only availabe when zc is compiled with the 'proj' build
    tag and is unavailable in the web browser version.
  example:
    - i: 39.203611 -76.856944
      o: [39.203611, -76.856944]
    - i: epsg.wgs-84 18n epsg.utm
      o: [39.203611, -76.856944, EPSG:4326, EPSG:32618]
    - i: proj
      o: [339660.12559342897, 4.341014551927999e6]


