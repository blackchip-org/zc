name: basic
title: Basic calculator
category: calc

ops:
- name: add
  aliases: [a, "+"]
  virtual: true
  title: Addition
  funcs:
  - params: [x:Int, y:Int]
    returns: [Int]
  - params: [x:Dec, y:Dec]
    returns: [Dec]
  - params: [x:Float, y:Float]
    returns: [Float]
  desc: Adds *x* to *y*.
  example:
  - i: c 6 2 a
    o: [8]
  - i: c 1.1 2.2 a
    o: [3.3]

- name: cube
  aliases: [cb]
  title: Cube of a number
  macro: dup dup mul mul
  desc: |-
    The cube of a number, x³
  example:
  - i: 3 cb
    o: [27]

- name: cube.root
  virtual: true
  aliases: [cbrt]
  title: Cube root
  funcs:
  - params: [x:Dec]
    returns: [Dec]
  desc: |-
    The cube root of *x*. If *x* is less than zero, an 'invalid argument'
    error is raised.
  example:
  - i: 27
    o: [27]
  - i: cbrt
    o: [3]

- name: div
  aliases: [d, "/"]
  virtual: true
  title: Division
  funcs:
  - params: [x:Dec, y:Dec]
    returns: [Dec]
  - params: [x:Float, y:Float]
    returns: [Float]
  desc: |-
    Divides *x* by *y*. If *y* is zero, a 'division by zero'
    error is raised.
  example:
  - i: c 12 4 d
    o: [3]
  - i: c 11 2 d
    o: [5.5]

- name: mod
  title: Modulus
  virtual: true
  funcs:
  - params: [x:Int, y:Int]
    returns: [Int]
  desc: |-
    The modulus when *x* is divided by *y*. If *y* is zero, a 'division by
    zero' error is raised.
  example:
  - i: -7
    o: [-7]
  - i: 2
    o: [-7, 2]
  - i: mod/i
    o: [1]

- name: mul
  title: Multiplication
  virtual: true
  aliases: [m, '*']
  funcs:
  - params: [x:Int, y:Int]
    returns: [Int]
  - params: [x:Dec, y:Dec]
    returns: [Dec]
  - params: [x:Float, y:Float]
    returns: [Float]
  desc: Multiplies *x* by *y*.
  example:
  - i: c 6 2 mul
    o: [12]
  - i: c 6.6 2.2 mul
    o: [14.52]

- name: neg
  virtual: true
  title: Negation
  funcs:
  - params: [x:Int]
    returns: [Int]
  desc: Changes the sign of *x*.
  example:
  - i: -6
    o: [-6]
  - i: neg
    o: [6]
  - i: neg
    o: [-6]

- name: pow
  virtual: true
  aliases: ['**']
  title: Exponentiation
  funcs:
  - params: [x:Int, y:Int]
    returns: [Int]
  desc: Raises *x* to the power of *y*.
  example:
  - i: 6
    o: [6]
  - i: 2
    o: [6, 2]
  - i: pow
    o: [36]

- name: rem
  virtual: true
  title: Remainder
  funcs:
  - params: [x:Int, y:Int]
    returns: [Int]
  desc: |-
    The remainder when *x* is divided by *y*. If *y* is zero, a
    'division by zero' error is raised.
  example:
  - i: -7
    o: [-7]
  - i: 2
    o: [-7, 2]
  - i: rem
    o: [-1]

- name: sign
  virtual: true
  title: Sign
  funcs:
  - params: [x:Int]
    returns: [Int/a]
  - params: [x:Dec]
    returns: [Int/a]
  desc: |-
    Places `-1` on the stack if *x* is negative, `1` if *x* is positive, or `0`
    if *x* is zero.
  example:
  - i: c -6 sign
    o: [-1]
  - i: c 6 sign
    o: [1]
  - i: c 0 sign
    o: [0]

- name: square
  aliases: [sq]
  title: Square of a number
  macro: dup mul
  desc: |-
    The square of a number, x²
  example:
  - i: 3 sq
    o: [9]

- name: square.root
  virtual: true
  aliases: [sqrt]
  title: Square Root
  funcs:
  - params: [x:Dec]
    returns: [Dec]
  desc: |-
    The square root of *x*. If *x* is less than zero, an 'invalid argument'
    error is raised.
  example:
  - i: 256
    o: [256]
  - i: sqrt
    o: [16]

- name: sub
  virtual: true
  aliases: [s, '-']
  title: Subtraction
  funcs:
  - params: [x:Int, y:Int]
    returns: [Int]
  - params: [x:Dec, y:Dec]
    returns: [Dec]
  desc: Subtracts the value of *y* from *x*
  example:
  - i: 6
    o: [6]
  - i: 2
    o: [6, 2]
  - i: sub
    o: [4]
