name: basic
title: Basic calculator
category: calc

ops:
- name: abs
  title: Absolute value
  funcs:
  - name: AbsBigInt
    params: [x:Int]
    returns: [Int]
  - name: AbsDecimal
    params: [x:Dec]
    returns: [Dec]
  - name: AbsComplex
    params: [x:Complex]
    returns: [Float/64]
  desc: |-
    If *x* is less than zero, the negated value of *x*, otherwise *p0*.

    For complex numbers, the distance of *x* from zero on the complex
    plane.
  example:
  - i: -6 abs
    o: [6]
  - i: c 2+2i abs 5 round
    o: [2.82843]
  tests:
  - name: Dec
    test:
    - i: -6.6 abs
      o: [6.6]

- name: add
  aliases: [a, "+"]
  title: Addition
  funcs:
  - name: AddBigInt
    params: [x:Int, y:Int]
    returns: [Int]
  - name: AddDecimal
    params: [x:Dec, y:Dec]
    returns: [Dec]
  - name: AddRat
    params: [x:Rat, y:Rat]
    returns: [Rat]
  - name: AddComplex
    params: [x:Complex, y:Complex]
    returns: [Complex]
  desc: Adds *x* to *y*.
  example:
  - i: c 6 2 a
    o: [8]
  - i: c 1.1 2.2 a
    o: [3.3]
  - i: c 1/2 1/4 add
    o: [3/4]
  - i: c 6+6i 2+2i a
    o: [8+8i]

- name: cube
  aliases: [cb]
  title: Cube of a number
  macro: dup dup mul mul
  desc: Cube of a nubmer, x³
  example:
  - i: 3 cb
    o: [27]

- name: cube.root
  aliases: [cbrt]
  title: Cube root
  funcs:
  - name: CbrtDecimal
    params: [x:Dec]
    returns: [Dec]
  desc: |-
    The cube root of *x*. If *x* is less than zero, an 'invalid argument'
    error is raised.
  example:
  - i: 27
    o: [27]
  - i: cbrt
    o: [3]

- name: ceil
  title: Ceiling
  funcs:
  - name: CeilDecimal
    params: [x:Dec]
    returns: [x:Dec]
  desc: |-
    The nearest integer value greater than or equal to *x*.
  example:
  - i: 6.6 ceil
    o: [7]

- name: div
  aliases: [d, "/"]
  title: Division
  funcs:
  - name: DivDecimal
    params: [x:Dec, y:Dec]
    returns: [Dec]
  - name: DivRat
    params: [x:Rat, y:Rat]
    returns: [Rat]
  - name: DivComplex
    params: [x:Complex, y:Complex]
    returns: [Complex]
  desc: |-
    Divides *x* by *y*. If *y* is zero, a division by zero error is raised.
  example:
  - i: c 12 4 d
    o: [3]
  - i: c 11 2 d
    o: [5.5]
  - i: c 1/4 4 div
    o: [1/16]
  - i: c 12+12i 4+12i d
    o: [1.2-0.6i]
  tests:
  - name: Thirds
    test:
      - i: 2 3 div
        o: [0.6666666666666666666666666667]
  - name: Zero
    test:
      - i: 6.6 0 div
        error: "div: division by zero"

- name: div/i
  title: Euclidean integer division
  funcs:
  - name: DivBigInt
    params: [x:Int, y:Int]
    returns: [Int]
  desc: |-
    Divides *x* by *y* using
    [Euclidean division](https://en.wikipedia.org/wiki/Euclidean_division).
    If *y* is zero, a division by zero error is raised.
  example:
  - i: -21 4 div/i
    o: [-6]
  tests:
  - name: Zero
    test:
      - i: 6 0 div/i
        error: "div/i: division by zero"

- name: div.mod
  title: Division with modulus
  funcs:
  - name: DivModBigInt
    params: [x:Int, y:Int]
    returns: [quo:Int, mod:Int]
  desc: |-
    The quotient *quo* and remainder *mod* when dividing *x* by *y* using
    Euclidean division. If *y* is zero, a division by zero error is raised.
  example:
  - i: c -21 4 div.mod
    o: ["-6 :quo", "3 :mod"]
  - i: c -21 4 div.rem
    o: ["-5 :quo", "-1 :rem"]
  tests:
  - name: Zero
    test:
    - i: 6 0 div.mod
      error: "div.mod: division by zero"

- name: div.rem
  aliases: [dr]
  title: Division with remainder
  funcs:
  - name: QuoRemBigInt
    params: [x:Int, y:Int]
    returns: [quo:Int, rem:Int]
  desc: |-
    The quotient *quo* and remainder *rem* when dividing *x* by *y* using
    truncated division. If *y* is zero, a division by zero error is raised.
  example:
  - i: c -21 4 div.mod
    o: ["-6 :quo", "3 :mod"]
  - i: c -21 4 div.rem
    o: ["-5 :quo", "-1 :rem"]
  tests:
  - name: Zero
    test:
    - i: 6 0 div.rem
      error: "div.rem: division by zero"

- name: exp
  title: Natural exponential
  funcs:
  - name: ExpDecimal
    params: [x:Dec]
    returns: [Dec]
  - name: ExpComplex
    params: [x:Complex]
    returns: [Complex]
  desc: Natural exponential of *x*.
  example:
  - i: 2 exp 5 round
    o: [7.38906]

- name: floor
  title: Floor
  funcs:
  - name: FloorDecimal
    params: [x:Dec]
    returns: [x:Dec]
  desc: The nearest integer value less than or equal to *x*.
  example:
  - i: 6.12 floor
    o: [6]

- name: log
  title: Natural logarithm
  funcs:
  - name: LogDecimal
    params: [x:Dec]
    returns: [Dec]
  - name: LogComplex
    params: [x:Complex]
    returns: [Complex]
  desc: Natural logarithm of *x*.
  example:
  - i: 7.5 log 4 round
    o: [2.0149]
  tests:
  - name: Complex
    test:
      - i: 7.5i log 4 round
        o: [2.0149+1.5708i]

- name: log10
  title: Decimal logarithm
  funcs:
  - name: Log10Decimal
    params: [x:Dec]
    returns: [Dec]
  - name: Log10Complex
    params: [x:Complex]
    returns: [Complex]
  desc: Natural logarithm of *x*.
  example:
  - i: 50 log10 5 round
    o: [1.69897]

- name: mod
  title: Modulus
  funcs:
  - name: ModBigInt
    params: [x:Int, y:Int]
    returns: [Int]
  desc: |-
    The modulus when *x* is divided by *y*. If *y* is zero, a division by zero
    error is raised.
  example:
  - i: c -21 4 mod
    o: [3]
  - i: c -21 4 rem
    o: [-1]
  tests:
  - name: Zero
    test:
    - i: 6 0 mod
      error: "mod: division by zero"

- name: mul
  title: Multiplication
  aliases: [m, '*']
  funcs:
  - name: MulBigInt
    params: [x:Int, y:Int]
    returns: [Int]
  - name: MulDecimal
    params: [x:Dec, y:Dec]
    returns: [Dec]
  - name: MulRat
    params: [x:Rat, y:Rat]
    returns: [Rat]
  - name: MulComplex
    params: [x:Complex, y:Complex]
    returns: [Complex]
  desc: Multiplies *x* by *y*.
  example:
  - i: c 6 2 mul
    o: [12]
  - i: c 6.6 2.2 mul
    o: [14.52]
  - i: c 1/16 4 mul
    o: [1/4]
  - i: c 2+3i 4+4i m
    o: [-4+20i]

- name: neg
  title: Negation
  funcs:
  - name: NegBigInt
    params: [x:Int]
    returns: [Int]
  - name: NegDecimal
    params: [x:Dec]
    returns: [Dec]
  - name: NegRat
    params: [x:Rat]
    returns: [Rat]
  - name: NegComplex
    params: [x:Complex]
    returns: [Complex]
  desc: Changes the sign of *x*.
  example:
  - i: -6
    o: [-6]
  - i: neg
    o: [6]
  - i: neg
    o: [-6]
  tests:
  - name: Decimal
    test:
    - i: -6.6 neg
      o: [6.6]

- name: pow
  aliases: ['**']
  title: Exponentiation
  funcs:
  - name: PowBigInt
    params: [x:Int, y:Int]
    returns: [Int]
  - name: PowDecimal
    params: [x:Dec, y:Dec]
    returns: [Dec]
  - name: PowComplex
    params: [x:Complex, y:Complex]
    returns: [Complex]
  desc: |-
    Raises *x* to the power of *y*. If *x* is negative and -1 < *y* < 1,
    an invalid operation error is raised. Certain values are errors when
    using a decimal number and are not when using an integer. For example:

    | *x* | *y* | Int | Decimal |
    | 0 | 0 | 1 | invalid operation |
    | 0 | -1 | 1 | infinity |
  example:
  - i: c 6 2 pow
    o: [36]
  - i: c 6.6 2.2 pow 2 round
    o: [63.53]
  - i: c 6+6i 2+2i pow 2 round
    o: [13.57-6.32i]
  tests:
  - name: BigIntZero
    test:
    - i: 0 0 pow
      o: [1]
  - name: BigIntInf
    test:
    - i: 0 -1 pow
      o: [1]
  - name: DecimalNegativeSqrt
    test:
    - i: -1 0.5 pow
      error: "pow: invalid operation"
  - name: DecimalZero
    test:
    - i: 0.0 0.0 pow
      error: "pow: invalid operation"
  - name: DecimalInf
    test:
    - i: 0.0 -1 pow
      error: "pow: infinity"

- name: rem
  aliases: ["%"]
  virtual: true
  title: Remainder
  funcs:
  - name: RemBigInt
    params: [x:Int, y:Int]
    returns: [Int]
  desc: |-
    The remainder when *x* is divided by *y*. If *y* is zero, a
    'division by zero' error is raised.
  example:
  - i: c -21 4 mod
    o: [3]
  - i: c -21 4 rem
    o: [-1]
  tests:
  - name: Zero
    test:
    - i: 6 0 rem
      error: "rem: division by zero"

- name: sign
  title: Sign
  funcs:
  - name: SignBigInt
    params: [x:Int]
    returns: [Int/s]
  - name: SignDecimal
    params: [x:Dec]
    returns: [Int/s]
  - name: SignRat
    params: [x:Rat, y:Rat]
    returns: [Rat]
  desc: |-
    Places `-1` on the stack if *x* is negative, `1` if *x* is positive, or `0`
    if *x* is zero.
  example:
  - i: c -6 sign
    o: [-1]
  - i: c 6 sign
    o: [1]
  - i: c 0 sign
    o: [0]
  tests:
  - name: Decimal
    test:
    - i: -6.4 sign
      o: [-1]

- name: square
  aliases: [sq]
  title: Square of a number
  macro: dup mul
  desc: |-
    The square of a number, x²
  example:
  - i: 3 sq
    o: [9]

- name: square.root
  aliases: [sqrt]
  title: Square Root
  funcs:
  - name: SqrtDecimal
    params: [x:Dec]
    returns: [Dec]
  - name: SqrtComplex
    params: [x:Complex]
    returns: [Complex]
  desc: |-
    The square root of *x*. If *x* is not Complex and is less than zero, an
    'invalid argument' error is raised.
  example:
  - i: c 1.5625 sqrt
    o: [1.25]
  - i: c -4+0i sqrt
    o: [0+2i]
  tests:
    - name: Negative
      test:
      - i: -1 sqrt
        error: "square.root: invalid argument, -1 < 0"

- name: sub
  aliases: [s, '-']
  title: Subtraction
  funcs:
  - name: SubBigInt
    params: [x:Int, y:Int]
    returns: [Int]
  - name: SubDecimal
    params: [x:Dec, y:Dec]
    returns: [Dec]
  - name: SubRat
    params: [x:Rat, y:Rat]
    returns: [Rat]
  - name: SubComplex
    params: [x:Complex, y:Complex]
    returns: [x:Complex]
  desc: Subtracts the value of *y* from *x*
  example:
  - i: c 6 2 sub
    o: [4]
  - i: c 6.6 2.2 sub
    o: [4.4]
  - i: c 3/4 1/2 sub
    o: [1/4]
  - i: c 6+6i 2+2i sub
    o: [4+4i]