name: basic
title: Basic calculator
category: calc

ops:
- name: add
  aliases: [a, "+"]
  virtual: true
  title: Addition
  funcs:
  - name: AddBigInt
    params: [x:Int, y:Int]
    returns: [Int]
  - name: AddDecimal
    params: [x:Dec, y:Dec]
    returns: [Dec]
  desc: Adds *x* to *y*.
  example:
  - i: c 6 2 a
    o: [8]
  - i: c 1.1 2.2 a
    o: [3.3]

- name: cb
  title: Cube of a number
  macro: dup dup mul mul
  desc: |-
    The cube of a number, x³
  example:
  - i: 3 cb
    o: [27]

- name: div
  aliases: [d, "/"]
  virtual: true
  title: Division
  funcs:
  - name: DivDecimal
    params: [x:Dec, y:Dec]
    returns: [Dec]
  desc: |-
    Divides *x* by *y*. If *y* is zero, a 'division by zero'
    error is raised.
  example:
  - i: c 12 4 d
    o: [3]
  - i: c 11 2 d
    o: [5.5]
  tests:
  - name: Thirds
    test:
      - i: 2 3 div
        o: [0.6666666666666667]
  - name: Zero
    test:
      - i: 6.6 0 div
        error: "div: division by zero"

- name: mod
  virtual: true
  title: Modulus
  funcs:
  - name: ModBigInt
    params: [x:Int, y:Int]
    returns: [Int]
  desc: |-
    The modulus when *x* is divided by *y*. If *y* is zero, a 'division by
    zero' error is raised.
  example:
  - i: -7
    o: [-7]
  - i: 2
    o: [-7, 2]
  - i: mod
    o: [1]
  tests:
  - name: Zero
    test:
    - i: 6 0 mod
      error: "mod: division by zero"

- name: mul
  virtual: true
  title: Multiplication
  aliases: [m, '*']
  funcs:
  - name: MulBigInt
    params: [x:Int, y:Int]
    returns: [Int]
  - name: MulDecimal
    params: [x:Dec, y:Dec]
    returns: [Dec]
  desc: Multiplies *x* by *y*.
  example:
  - i: c 6 2 mul
    o: [12]
  - i: c 6.6 2.2 mul
    o: [14.52]

- name: neg
  virtual: true
  title: Negation
  funcs:
  - name: NegBigInt
    params: [x:Int]
    returns: [Int]
  - name: NegDecimal
    params: [x:Dec]
    returns: [Dec]
  desc: Changes the sign of *x*.
  example:
  - i: -6
    o: [-6]
  - i: neg
    o: [6]
  - i: neg
    o: [-6]
  tests:
  - name: Decimal
    test:
    - i: -6.6 neg
      o: [6.6]

- name: pow
  virtual: true
  aliases: ['**']
  title: Exponentiation
  funcs:
  - name: PowBigInt
    params: [x:Int, y:Int]
    returns: [Int]
  - name: PowDecimal
    params: [x:Dec, y:Dec]
    returns: [Dec]
  desc: Raises *x* to the power of *y*.
  example:
  - i: 6
    o: [6]
  - i: 2
    o: [6, 2]
  - i: pow
    o: [36]
  tests:
  - name: BigIntZero
    test:
    - i: 0 0 pow
      o: [1]
  - name: BigIntInf
    test:
    - i: 0 -1 pow
      o: [1]
  - name: DecimalNegativeSqrt
    test:
    - i: -1 0.5 pow
      error: "pow: invalid operation"
  - name: DecimalZero
    test:
    - i: 0.0 0.0 pow
      error: "pow: invalid operation"
  - name: DecimalInf
    test:
    - i: 0.0 -1 pow
      error: "pow: infinity"

- name: rem
  virtual: true
  title: Remainder
  funcs:
  - name: RemBigInt
    params: [x:Int, y:Int]
    returns: [Int]
  - name: RemDecimal
    params: [x:Dec, y:Dec]
    returns: [Dec]
  desc: |-
    The remainder when *x* is divided by *y*. If *y* is zero, a
    'division by zero' error is raised.
  example:
  - i: -7 -2 rem
    o: [-1]
  - i: c 6.75 0.5 rem
    o: [0.25]
  tests:
  - name: BigIntZero
    test:
    - i: 6 0 rem
      error: "rem: division by zero"
  - name: DecimalZero
    test:
    - i: 6.6 0 rem
      error: "rem: division by zero"

- name: sign
  virtual: true
  title: Sign
  funcs:
  - name: SignBigInt
    params: [x:Int]
    returns: [Int/s]
  - name: SignDecimal
    params: [x:Dec]
    returns: [Int/s]
  desc: |-
    Places `-1` on the stack if *x* is negative, `1` if *x* is positive, or `0`
    if *x* is zero.
  example:
  - i: c -6 sign
    o: [-1]
  - i: c 6 sign
    o: [1]
  - i: c 0 sign
    o: [0]
  tests:
  - name: Decimal
    test:
    - i: -6.4 sign
      o: [-1]

- name: sq
  title: Square of a number
  macro: dup mul
  desc: |-
    The square of a number, x²
  example:
  - i: 3 sq
    o: [9]

- name: sqrt
  title: Square Root
  virtual: true
  funcs:
  - name: SqrtDecimal
    params: [x:Dec]
    returns: [Dec]
  desc: |-
    The square root of *x*. If *x* is less than zero, an 'invalid argument'
    error is raised.
  example:
  - i: 1.25 sq
    o: [1.5625]
  - i: sqrt
    o: [1.25]
  tests:
    - name: Negative
      test:
      - i: -1 sqrt
        error: "sqrt: invalid argument, -1 < 0"

- name: sub
  virtual: true
  aliases: [s, '-']
  title: Subtraction
  funcs:
  - name: SubBigInt
    params: [x:Int, y:Int]
    returns: [Int]
  - name: SubDecimal
    params: [x:Dec, y:Dec]
    returns: [Dec]
  desc: Subtracts the value of *y* from *x*
  example:
  - i: c 6 2 sub
    o: [4]
  - i: c 6.6 2.2 sub
    o: [4.4]
