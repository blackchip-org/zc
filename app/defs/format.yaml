name: format
title: Value formatting
category: calc

ops:
- name: round
  aliases: [r]
  title: Round number
  funcs:
  - name: RoundDecimal
    params: [x:Dec, p:Int/s32]
    returns: [x:Dec]
  - name: RoundComplex
    params: [x:Complex, p:Int/s32]
    returns: [x:Text]
  desc: |-
    Rounds the decimal number *x* to a number of places *p*. If *p* is
    positive, the number is rounded to that many places after the decimal
    point. If *p* is zero, the number is rounded to an integer. If *p* is
    negative, is is rounded to that many places left of the decimal point.

    For complex numbers, *p* must not be negative.
  example:
  - i: 200000 3 div
    o: [66666.66666666667]
  - i: 3 round
    o: [66666.667]
  - i: 0 round
    o: [66667]
  - i: -3 round
    o: [67000]
  tests:
  - name: Complex
    test:
    - i: 1.047197551196598+5.948293i 3 round
      o: [1.047+5.948i]
  - name: ComplexNegative
    test:
    - i: 1.047197551196598+5.948293i -3 round
      error: "round: invalid argument, -3 < 0"

- name: scientific.notation
  aliases: [sci]
  title: Scientific Notation
  funcs:
  - name: SciDecimal
    params: [x:Dec]
    returns: [x:Dec]
  desc: |-
    Formats *x* using scientific notation
  example:
  - i: 123 sci
    o: [1.23e2]
