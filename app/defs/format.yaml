name: format
title: Value formatting
category: calc

ops:
- name: round
  aliases: [r]
  virtual: true
  title: Round number
  funcs:
  - params: [x:Dec, p:int/32]
    returns: [x:Dec]
  desc: |-
    Rounds the decimal number *x* to a number of places *p*. If *p* is
    positive, the number is rounded to that many places after the decimal
    point. If *p* is zero, the number is rounded to an integer. If *p* is
    negative, is is round to that many places left of the decimal point.
  example:
  - i: 200000 3 div
    o: [66666.66666666667]
  - i: 3 round/d
    o: [66666.667]
  - i: 0 round/d
    o: [66667]
  - i: -3 round/d
    o: [67000]

- name: scientific.notation
  aliases: [sn]
  virtual: true
  funcs:
  - params: [x:Dec]
    returns: [x:Dec]
  desc: |-
    Formats *x* using scientific notation
  example:
    - i: 123 sn
      o: [1.23e2]

